services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5002:5001"
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cat-dog-vote
      DELETE_SECRET: change-this-to-a-random-string
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongo:
        condition: service_started

  mongo:
    build:
      context: .
      dockerfile: Dockerfile.database
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    restart: unless-stopped

  # Instant trigger: smee.io relays GitHub webhook -> Jenkins Generic Webhook Trigger endpoint
  # (GitHub cannot reach localhost Jenkins directly; smee gives a stable public URL.)
  smee:
    image: node:20-alpine
    container_name: smee
    command: >
      sh -c "npm install -g --no-fund --silent smee-client &&
             smee --url ${SMEE_URL:-https://smee.io/cat-dog-vote-ci} --target ${SMEE_TARGET:-http://jenkins:8080/generic-webhook-trigger/invoke?token=cat-dog-vote}"
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  mongo-data:
  jenkins-data:
