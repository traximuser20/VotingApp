<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="winnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)">🐱🐶 Who's Your Favorite? 🐶🐱</text>
  <text x="300" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Cast your vote and see what others think!</text>

  <!-- Cat Card -->
  <rect x="40" y="100" width="240" height="200" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="2" stroke-opacity="0.4"/>
  <text x="160" y="145" text-anchor="middle" font-size="42">🐱</text>
  <text x="160" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">Cat</text>
  <text x="160" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Independent, curious, and secretly</text>
  <text x="160" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">plotting world domination</text>

  <!-- Cat Vote Badge -->
  <rect x="100" y="225" width="120" height="26" rx="13" fill="#f472b6" fill-opacity="0.12"/>
  <text x="160" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f472b6">42 votes</text>

  <!-- Cat Button -->
  <rect x="100" y="265" width="120" height="32" rx="16" fill="#f472b6"/>
  <text x="160" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">Vote Cat</text>

  <!-- Dog Card -->
  <rect x="320" y="100" width="240" height="200" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4"/>
  <text x="440" y="145" text-anchor="middle" font-size="42">🐶</text>
  <text x="440" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">Dog</text>
  <text x="440" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Loyal, playful, and always</text>
  <text x="440" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">happy to see you</text>

  <!-- Dog Vote Badge -->
  <rect x="380" y="225" width="120" height="26" rx="13" fill="#60a5fa" fill-opacity="0.12"/>
  <text x="440" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">51 votes</text>

  <!-- Dog Button -->
  <rect x="380" y="265" width="120" height="32" rx="16" fill="#60a5fa"/>
  <text x="440" y="286" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">Vote Dog</text>

  <!-- Progress Bar Container -->
  <rect x="40" y="320" width="520" height="60" rx="16" fill="#1e293b"/>
  <rect x="60" y="340" width="480" height="16" rx="8" fill="#334155"/>
  <rect x="60" y="340" width="216" height="16" rx="8" fill="#f472b6"/>
  <rect x="276" y="340" width="264" height="16" rx="8" fill="#60a5fa"/>

  <!-- Progress Labels -->
  <text x="70" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">🐱 45%</text>
  <text x="300" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Total: 93 votes</text>
  <text x="530" y="372" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">🐶 55%</text>

  <!-- Winner Badge -->
  <rect x="215" y="395" width="170" height="28" rx="14" fill="url(#winnerGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>
  <text x="300" y="414" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">🏆 Dogs are winning!</text>
</svg>
